<!DOCTYPE html>
<html lang="mn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Чамд зориулсан тусгай хуудас ✨❤️</title>
    <style>
        :root {
            --primary: #ff477e;
            --primary-dark: #d6336c;
            --primary-light: #ff85a1;
            --bg-gradient-1: #1a0b2e;
            --bg-gradient-2: #3b185f;
            --bg-gradient-3: #a12568;
            --glass-bg: rgba(255, 255, 255, 0.12);
            --glass-border: rgba(255, 255, 255, 0.25);
            --text-main: #ffffff;
            --text-muted: #f8edeb;
            --card-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: linear-gradient(-45deg, var(--bg-gradient-1), var(--bg-gradient-2), var(--bg-gradient-3), #2b1055);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
            color: var(--text-main);
            padding: 20px;
            position: relative;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        #bgCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* Хөгжим асаах товч */
        .music-control {
            position: fixed;
            top: 20px;
            right: 20px;
            z-index: 100;
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            color: white;
            padding: 10px 16px;
            border-radius: 50px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.9rem;
            font-weight: 600;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: all 0.3s ease;
        }

        .music-control:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: translateY(-2px);
        }

        .music-bars {
            display: flex;
            align-items: flex-end;
            height: 14px;
            gap: 2px;
        }

        .bar {
            width: 3px;
            background: #ff85a1;
            border-radius: 2px;
            height: 4px;
            transition: height 0.2s ease;
        }

        .playing .bar:nth-child(1) { animation: soundBar 0.5s infinite alternate; }
        .playing .bar:nth-child(2) { animation: soundBar 0.7s infinite alternate 0.2s; }
        .playing .bar:nth-child(3) { animation: soundBar 0.4s infinite alternate 0.1s; }
        .playing .bar:nth-child(4) { animation: soundBar 0.6s infinite alternate 0.3s; }

        @keyframes soundBar {
            0% { height: 4px; }
            100% { height: 14px; }
        }

        .main-wrapper {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 460px;
        }

        .card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 30px;
            padding: 35px 28px;
            box-shadow: var(--card-shadow);
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .step {
            display: none;
            animation: fadeInScale 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .step.active {
            display: block;
        }

        @keyframes fadeInScale {
            from { opacity: 0; transform: scale(0.92) translateY(15px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }

        .avatar-ring {
            width: 150px;
            height: 150px;
            margin: 0 auto 22px;
            border-radius: 50%;
            padding: 6px;
            background: linear-gradient(45deg, #ff477e, #ff9a9e, #7209b7);
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.4);
            position: relative;
        }

        .avatar-ring img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            background: #fff;
        }

        .floating-badge {
            position: absolute;
            bottom: 0;
            right: 5px;
            background: #ff477e;
            color: white;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            border: 3px solid #2b1055;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        h1 {
            font-size: 1.65rem;
            font-weight: 800;
            margin-bottom: 14px;
            background: linear-gradient(to right, #ffffff, #ffc2d1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            line-height: 1.3;
        }

        .typewriter-text {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.6;
            min-height: 75px;
            margin-bottom: 24px;
            font-weight: 400;
        }

        .cursor {
            display: inline-block;
            width: 2px;
            height: 1.1em;
            background-color: #ff85a1;
            margin-left: 2px;
            vertical-align: middle;
            animation: blink 0.8s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0; }
        }

        .btn-group {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            min-height: 65px;
            position: relative;
        }

        .btn {
            padding: 14px 30px;
            font-size: 1.05rem;
            font-weight: 700;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #ff477e 0%, #ff0a54 100%);
            color: white;
            box-shadow: 0 10px 25px rgba(255, 71, 126, 0.45);
        }

        .btn-primary:hover {
            transform: translateY(-3px) scale(1.03);
            box-shadow: 0 15px 30px rgba(255, 10, 84, 0.6);
        }

        .btn-secondary {
            background: rgba(255, 255, 255, 0.15);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            backdrop-filter: blur(5px);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        #noBtn {
            position: relative;
            z-index: 50;
            transition: all 0.15s ease-out;
        }

        /* Мэйл илгээх форм */
        .form-container {
            margin-top: 18px;
            text-align: left;
            background: rgba(0, 0, 0, 0.2);
            padding: 18px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        .form-label {
            display: block;
            font-size: 0.9rem;
            color: #ffc2d1;
            font-weight: 600;
            margin-bottom: 8px;
        }

        .input-field {
            width: 100%;
            padding: 12px 15px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 12px;
            transition: all 0.3s ease;
        }

        .input-field::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }

        .input-field:focus {
            border-color: #ff85a1;
            background: rgba(255, 255, 255, 0.18);
            box-shadow: 0 0 15px rgba(255, 133, 161, 0.25);
        }

        textarea.input-field {
            height: 110px;
            resize: none;
        }

        .action-buttons {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .btn-full {
            width: 100%;
        }

        .status-msg {
            margin-top: 12px;
            font-size: 0.88rem;
            text-align: center;
            font-weight: 600;
            min-height: 22px;
            color: #80ed99;
        }

        .floating-heart {
            position: fixed;
            bottom: -30px;
            pointer-events: none;
            z-index: 999;
            animation: floatHeartUp linear forwards;
        }

        @keyframes floatHeartUp {
            0% { transform: translateY(0) scale(0.8) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-110vh) scale(1.3) rotate(360deg); opacity: 0; }
        }
    </style>
</head>
<body>

    <canvas id="bgCanvas"></canvas>

    <button class="music-control" id="musicToggle" onclick="toggleMusic()">
        <div class="music-bars" id="musicBars">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
        </div>
        <span id="musicText">Ая асаах</span>
    </button>

    <div class="main-wrapper">
        <div class="card">

            <!-- АЛХАМ 1: ЭХЛЭЛ -->
            <div class="step active" id="step1">
                <div class="avatar-ring">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExbW51emE4Nm14eW15eW15eW15eW15eW15eW15eW15eW15eW15JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/cLS1cfxvGOPVpf9g3y/giphy.gif" alt="Cute Bear">
                    <div class="floating-badge">💌</div>
                </div>
                <h1>Сайн уу? ✨</h1>
                <div class="typewriter-text" id="typewriter1"></div>
                <button class="btn btn-primary btn-full" onclick="goToStep(2)">
                    Цааш үзэх 👉
                </button>
            </div>

            <!-- АЛХАМ 2: ГОЛ АСУУЛТ (ЦААШДАА ХАРИЛЦААТАЙ БАЙХ УУ?) -->
            <div class="step" id="step2">
                <div class="avatar-ring">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExN2Z4eW15eW15eW15eW15eW15eW15eW15eW15eW15eW15JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/26FLdmIp6wJr91JAI/giphy.gif" alt="Shy Heart">
                    <div class="floating-badge">💓</div>
                </div>
                <h1>Чамд хэлэх чухал зүйл байна...</h1>
                <p style="font-size: 1.05rem; color: #fff; line-height: 1.6; margin-bottom: 26px;">
                    Чи надад үнэхээр их таалагддаг. Хоёулаа цаашдаа харилцаатай байх уу? ❤️
                </p>

                <div class="btn-group">
                    <button class="btn btn-primary" id="yesBtn" onclick="acceptProposal()">
                        Тийм, тэгье! 🥰
                    </button>
                    <button class="btn btn-secondary" id="noBtn">
                        Үгүй 😢
                    </button>
                </div>
            </div>

            <!-- АЛХАМ 3: ЗӨВШӨӨРСНИЙ ДАРААХ ХЭСЭГ БА МЭЙЛ -->
            <div class="step" id="step3">
                <div class="avatar-ring">
                    <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2Z4eW15eW15eW15eW15eW15eW15eW15eW15eW15eW15JmVwPXYxX2ludGVybmFsX2dpZl9ieV9pZCZjdD1n/T86i6yDyOYz7J6dPhf/giphy.gif" alt="Happy Celebration">
                    <div class="floating-badge">🎉</div>
                </div>
                <h1>Хамгийн гоё хариулт! ❤️✨</h1>
                <p style="font-size: 0.95rem; color: #f8edeb; margin-bottom: 12px;">
                    Доор мэдээллээ бичээд шууд над руу илгээгээрэй 👇
                </p>

                <div class="form-container">
                    <label class="form-label" for="herName">Чиний нэр (эсвэл хоч):</label>
                    <input type="text" id="herName" class="input-field" placeholder="Нэрээ энд бичээрэй...">

                    <label class="form-label" for="herMessage">Надад хэлэх зурвас:</label>
                    <textarea id="herMessage" class="input-field" placeholder="Сэтгэгдлээ энд чөлөөтэй бичээрэй... ❤️"></textarea>

                    <div class="action-buttons">
                        <button class="btn btn-primary btn-full" id="submitEmailBtn" onclick="sendEmailDirectly()">
                            Шууд Gmail рүү илгээх 📩
                        </button>
                        <button class="btn btn-secondary btn-full" onclick="openMailAppBackup()" style="font-size: 0.88rem; padding: 10px;">
                            Gmail апп-аар илгээх (Нөөц) ✉️
                        </button>
                    </div>
                    <div class="status-msg" id="statusMsg"></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        const TARGET_EMAIL = "enkhhuslen0401@gmail.com";

        // Typewriter эффект
        const introText = "Чамд зориулж энэ жижигхэн хуудсыг тусгайлан бэлдлээ. Хэдхэн хором зарцуулаад уншаарай... ✨";
        let charIndex = 0;

        function typeWriter() {
            const element = document.getElementById("typewriter1");
            if (charIndex < introText.length) {
                element.innerHTML = introText.substring(0, charIndex + 1) + '<span class="cursor"></span>';
                charIndex++;
                setTimeout(typeWriter, 45);
            } else {
                element.innerHTML = introText;
            }
        }

        window.addEventListener("load", () => {
            typeWriter();
            initCanvas();
        });

        function goToStep(stepNumber) {
            document.querySelectorAll('.step').forEach(el => el.classList.remove('active'));
            document.getElementById(`step${stepNumber}`).classList.add('active');

            if (stepNumber === 2 && !isPlaying) {
                toggleMusic();
            }
        }

        // "Үгүй" товч зугтах
        const noBtn = document.getElementById('noBtn');
        const yesBtn = document.getElementById('yesBtn');

        const funnyNoPhrases = [
            "Итгэлтэй байна уу? 🥺",
            "Дахиад нэг бодоод үзээч...",
            "Гуйж байна шдээ 😭",
            "Зүрх минь өвдлөө 💔",
            "Энэ товч эвдэрчихсэн ээ 😜",
            "Зүгээр л Тийм дээр дарчих ❤️",
            "Баригдахгүй ээ! 🏃‍♂️💨"
        ];

        let noAttempts = 0;
        let yesScale = 1;

        function dodgeNoButton() {
            if (noAttempts < funnyNoPhrases.length) {
                noBtn.innerText = funnyNoPhrases[noAttempts];
            } else {
                noBtn.innerText = funnyNoPhrases[Math.floor(Math.random() * funnyNoPhrases.length)];
            }
            noAttempts++;

            yesScale += 0.15;
            yesBtn.style.transform = `scale(${Math.min(yesScale, 1.8)})`;

            const padding = 20;
            const maxX = window.innerWidth - noBtn.offsetWidth - padding;
            const maxY = window.innerHeight - noBtn.offsetHeight - padding;

            const randomX = Math.max(padding, Math.floor(Math.random() * maxX));
            const randomY = Math.max(padding, Math.floor(Math.random() * maxY));

            noBtn.style.position = 'fixed';
            noBtn.style.left = randomX + 'px';
            noBtn.style.top = randomY + 'px';
        }

        noBtn.addEventListener('mouseover', dodgeNoButton);
        noBtn.addEventListener('touchstart', (e) => {
            e.preventDefault();
            dodgeNoButton();
        });
        noBtn.addEventListener('click', dodgeNoButton);

        function acceptProposal() {
            noBtn.style.display = 'none';
            goToStep(3);
            startHeartShower();
        }

        // Gmail рүү шууд илгээх
        async function sendEmailDirectly() {
            const name = document.getElementById('herName').value.trim() || "Нууцлаг нэгэн";
            const message = document.getElementById('herMessage').value.trim();
            const statusMsg = document.getElementById('statusMsg');
            const submitBtn = document.getElementById('submitEmailBtn');

            if (!message) {
                statusMsg.style.color = "#ffb703";
                statusMsg.innerText = "⚠️ Эхлээд зурвасаа бичээрэй!";
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerText = "Илгээж байна... ⏳";
            statusMsg.style.color = "#fff";
            statusMsg.innerText = "Түр хүлээнэ үү...";

            try {
                const response = await fetch(`https://formsubmit.co/ajax/${TARGET_EMAIL}`, {
                    method: "POST",
                    headers: { 
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({
                        _subject: `❤️ Шинэ хариу ирлээ! (${name})`,
                        Нэр: name,
                        Хариулт: "ТИЙМ, цаашдаа харилцаатай байя! ❤️",
                        Зурвас: message
                    })
                });

                if (response.ok) {
                    statusMsg.style.color = "#80ed99";
                    statusMsg.innerText = "✅ Амжилттай илгээгдлээ! Чиний зурвас очсон шүү ❤️";
                    submitBtn.innerText = "Илгээгдсэн! 🎉";
                    startHeartShower();
                } else {
                    throw new Error("Server error");
                }
            } catch (error) {
                statusMsg.style.color = "#ffb703";
                statusMsg.innerText = "И-мэйл апп руу шилжиж байна...";
                submitBtn.disabled = false;
                submitBtn.innerText = "Шууд Gmail рүү илгээх 📩";
                openMailAppBackup();
            }
        }

        function openMailAppBackup() {
            const name = document.getElementById('herName').value.trim() || "Миний зүгээс";
            const message = document.getElementById('herMessage').value.trim() || "Би зөвшөөрлөө! Цаашдаа харилцаатай байя ❤️";
            
            const subject = encodeURIComponent(`❤️ Чамд өгөх миний хариу (${name})`);
            const body = encodeURIComponent(
                `Сайн уу!\n\n` +
                `Миний хариулт: ТИЙМ, цаашдаа харилцаатай байя! ❤️\n\n` +
                `Миний зурвас:\n"${message}"`
            );

            window.location.href = `mailto:${TARGET_EMAIL}?subject=${subject}&body=${body}`;
            document.getElementById('statusMsg').innerText = "✅ И-мэйл апп нээгдлээ, илгээх товчийг дараарай!";
        }

        // Хөгжим тоглуулагч
        let audioCtx = null;
        let isPlaying = false;
        let melodyInterval = null;
        const notes = [261.63, 329.63, 392.00, 493.88, 523.25, 493.88, 392.00, 329.63, 
                       220.00, 261.63, 329.63, 392.00, 440.00, 392.00, 329.63, 261.63];
        let noteIndex = 0;

        function playSoftNote(freq) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            
            gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.08, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 1.8);
            
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            
            osc.start();
            osc.stop(audioCtx.currentTime + 1.9);
        }

        function toggleMusic() {
            const btn = document.getElementById('musicToggle');
            const bars = document.getElementById('musicBars');
            const text = document.getElementById('musicText');

            if (!isPlaying) {
                if (!audioCtx) {
                    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                }
                if (audioCtx.state === 'suspended') {
                    audioCtx.resume();
                }
                isPlaying = true;
                bars.classList.add('playing');
                text.innerText = "Ая унтраах";
                
                playSoftNote(notes[noteIndex]);
                noteIndex = (noteIndex + 1) % notes.length;
                melodyInterval = setInterval(() => {
                    playSoftNote(notes[noteIndex]);
                    noteIndex = (noteIndex + 1) % notes.length;
                }, 650);
            } else {
                isPlaying = false;
                bars.classList.remove('playing');
                text.innerText = "Ая асаах";
                clearInterval(melodyInterval);
            }
        }

        // Нисдэг зүрхнүүд
        function spawnSingleHeart() {
            const heart = document.createElement('div');
            heart.classList.add('floating-heart');
            const emojis = ['❤️', '💖', '🥰', '💕', '✨', '🌸'];
            heart.innerText = emojis[Math.floor(Math.random() * emojis.length)];
            heart.style.left = Math.random() * 95 + 'vw';
            heart.style.fontSize = (Math.random() * 16 + 18) + 'px';
            const duration = Math.random() * 2 + 3;
            heart.style.animationDuration = duration + 's';
            document.body.appendChild(heart);

            setTimeout(() => heart.remove(), duration * 1000);
        }

        function startHeartShower() {
            for (let i = 0; i < 15; i++) {
                setTimeout(spawnSingleHeart, i * 150);
            }
            setInterval(spawnSingleHeart, 450);
        }

        // Арын оддын canvas
        function initCanvas() {
            const canvas = document.getElementById('bgCanvas');
            const ctx = canvas.getContext('2d');
            let width, height, particles;

            function resize() {
                width = canvas.width = window.innerWidth;
                height = canvas.height = window.innerHeight;
            }

            class Particle {
                constructor() {
                    this.reset();
                }
                reset() {
                    this.x = Math.random() * width;
                    this.y = Math.random() * height;
                    this.size = Math.random() * 2.5 + 0.5;
                    this.speedY = -(Math.random() * 0.4 + 0.1);
                    this.opacity = Math.random() * 0.7 + 0.2;
                    this.fadeSpeed = Math.random() * 0.01 + 0.005;
                }
                update() {
                    this.y += this.speedY;
                    this.opacity += this.fadeSpeed;
                    if (this.opacity >= 1 || this.opacity <= 0.1) {
                        this.fadeSpeed = -this.fadeSpeed;
                    }
                    if (this.y < 0) {
                        this.y = height;
                        this.x = Math.random() * width;
                    }
                }
                draw() {
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 220, 235, ${this.opacity})`;
                    ctx.fill();
                }
            }

            function setup() {
                resize();
                particles = Array.from({ length: 75 }, () => new Particle());
            }

            function animate() {
                ctx.clearRect(0, 0, width, height);
                particles.forEach(p => {
                    p.update();
                    p.draw();
                });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            setup();
            animate();
        }
    </script>
</body>
</html>
